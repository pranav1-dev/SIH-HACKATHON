<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Dashboard — Medikiosk-CaseTaker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9fafb;
    --card-line: #e5e7eb;
    --accent: #93c5fd;
    --accent-dark: #2563eb;
    --accent-darker: #1d4ed8;
    --muted: #6b7280;
    --serif: Georgia, 'Times New Roman', serif;
    --danger: #dc2626;
    --success: #16a34a;
    --warn: #d97706;
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #1f2937;
    background: var(--bg);
    min-height: 100vh;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 40px;
    background: #fff;
    border-bottom: 1px solid #e5e7eb;
  }

  header h1 { font-size: 20px; color: var(--accent-dark); }

  .header-right { display: flex; align-items: center; gap: 16px; }

  .who { font-size: 13px; color: var(--muted); }
  .who strong { color: #1f2937; }

  .logout-btn {
    background: transparent;
    border: 1px solid #d1d5db;
    color: #374151;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .logout-btn:hover { background: #f3f4f6; }

  main {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }

  .demo-banner {
    font-size: 12px;
    color: #9a3412;
    background: #fff7ed;
    border: 1px solid #fdba74;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 22px;
  }

  .greeting h2 {
    font-family: var(--serif);
    font-size: 24px;
    color: #111827;
    margin-bottom: 4px;
  }

  .greeting p {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  /* ---------- New patient: empty state ---------- */
  .empty-state {
    background: #fff;
    border: 1px solid var(--card-line);
    border-radius: 10px;
    padding: 40px 32px;
    text-align: center;
  }

  .empty-state .icon { font-size: 38px; margin-bottom: 10px; }

  .empty-state h3 {
    font-family: var(--serif);
    font-size: 19px;
    margin-bottom: 6px;
    color: #111827;
  }

  .empty-state p {
    font-size: 13.5px;
    color: var(--muted);
    max-width: 420px;
    margin: 0 auto 20px;
    line-height: 1.5;
  }

  /* ---------- Buttons ---------- */
  .btn {
    padding: 12px 22px;
    border-radius: 6px;
    font-size: 14.5px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: inline-block;
    text-decoration: none;
  }

  .btn-primary { background: var(--accent-dark); color: #fff; }
  .btn-primary:hover { background: var(--accent-darker); }

  .btn-secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
  .btn-secondary:hover { background: #f3f4f6; }

  .btn-block { display: block; width: 100%; text-align: center; }

  /* ---------- Returning patient: new-visit CTA ---------- */
  .new-visit-card {
    background: #fff;
    border: 1px solid var(--card-line);
    border-radius: 10px;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .new-visit-card .left h3 {
    font-size: 15.5px;
    margin-bottom: 4px;
  }

  .new-visit-card .left p {
    font-size: 13px;
    color: var(--muted);
  }

  /* ---------- Previous forms list ---------- */
  .section-label {
    font-size: 12.5px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .form-card {
    background: #fff;
    border: 1px solid var(--card-line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .form-card-summary {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    gap: 12px;
  }

  .form-card-summary:hover { background: #f9fafb; }

  .form-card-summary .fdate {
    font-weight: 600;
    font-size: 14.5px;
  }

  .form-card-summary .fcomplaint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge.pending { background: #fff7ed; color: var(--warn); border: 1px solid #fdba74; }
  .badge.reviewed { background: #f0fdf4; color: var(--success); border: 1px solid #86efac; }
  .badge.urgent { background: #fef2f2; color: var(--danger); border: 1px solid #fca5a5; }

  .chevron {
    font-size: 12px;
    color: var(--muted);
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }

  .form-card.open .chevron { transform: rotate(180deg); }

  .form-card-details {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--card-line);
  }

  .form-card.open .form-card-details { display: block; padding-top: 16px; }

  .detail-section { margin-bottom: 14px; }

  .detail-section h4 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .detail-text {
    font-size: 13.5px;
    line-height: 1.5;
    color: #374151;
  }

  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }

  .tag {
    background: #eff6ff;
    color: var(--accent-darker);
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 20px;
    border: 1px solid #bfdbfe;
  }

  .vitals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 8px;
  }

  .vital-box {
    background: #f9fafb;
    border: 1px solid var(--card-line);
    border-radius: 8px;
    padding: 8px 10px;
  }

  .vital-box .v-label { font-size: 11px; color: var(--muted); }
  .vital-box .v-value { font-size: 14.5px; font-weight: 600; margin-top: 1px; }

  .doctor-note-box {
    background: #f0fdf4;
    border: 1px solid #86efac;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: #14532d;
  }

  .doctor-note-box.empty {
    background: #f9fafb;
    border: 1px solid var(--card-line);
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>

<header>
  <h1>Medikiosk-CaseTaker</h1>
  <div class="header-right">
    <span class="who">Signed in as <strong id="patientNameLabel">Patient</strong></span>
    <a href="login-page.html" class="logout-btn" onclick="logout(); return false;">Log Out</a>
  </div>
</header>

<main>

  

  <div class="greeting">
    <h2 id="greetingHeading">Welcome back</h2>
    <p id="greetingSub">Here's your intake history.</p>
  </div>

  <!-- Filled in by JS: either the empty-state (no forms yet) or the
       new-visit CTA + list of previous forms (returning patient) -->
  <div id="content"></div>

</main>

<script>
  /* ============================================================
     Session guard — reuses the 'mk_session' pattern from login-page.html.
     Patients are keyed by the identifier they logged in with
     (session.name), so each patient ID sees only their own forms.
     Doctors are bounced to the shared doctor-dashboard.html instead.
     ============================================================ */
  const session = JSON.parse(localStorage.getItem('mk_session') || 'null');
  if (!session) {
    window.location.href = 'login-page.html';
  } else if (session.role === 'doctor') {
    window.location.href = 'dashboard-doctor.html';
  } else {
    document.getElementById('patientNameLabel').textContent = session.name || 'Patient';
  }

  function logout() {
    localStorage.removeItem('mk_session');
    window.location.href = 'login-page.html';
  }

  // ---- Demo data: one seeded patient with a filled history, so
  // both states are easy to test. Log in with patient ID "demo123"
  // to see the "already filled" view; any other ID starts empty. ----
  const SEED_RECORDS = {
    'demo123': [
      {
        submittedAt: '2026-08-20T10:15:00',
        status: 'reviewed',
        chiefComplaint: 'Persistent cough and mild fever for 5 days.',
        history: 'No chronic conditions. Non-smoker. Mild seasonal allergies reported.',
        symptoms: ['Cough', 'Fever', 'Fatigue'],
        vitals: { bp: '118/78', pulse: '84 bpm', temp: '100.1°F', spo2: '97%' },
        doctorNotes: 'Likely viral upper respiratory infection. Advised rest, fluids, and paracetamol as needed. Follow up if fever persists beyond 3 more days.'
      },
      {
        submittedAt: '2026-09-04T09:30:00',
        status: 'pending',
        chiefComplaint: 'Recurring lower back pain, worse after long sitting.',
        history: 'Desk job, ~9 hours/day seated. No prior injury reported.',
        symptoms: ['Back pain', 'Stiffness'],
        vitals: { bp: '120/80', pulse: '76 bpm', temp: '98.4°F', spo2: '99%' },
        doctorNotes: ''
      }
    ]
  };

  function loadAllRecords() {
    let records = JSON.parse(localStorage.getItem('mk_patient_intakes') || 'null');
    if (!records) {
      records = SEED_RECORDS;
      localStorage.setItem('mk_patient_intakes', JSON.stringify(records));
    }
    return records;
  }

  function getMyForms() {
    const all = loadAllRecords();
    const key = (session && session.name) ? session.name : '';
    return all[key] || [];
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }

  function badgeHtml(status) {
    if (status === 'urgent') return '<span class="badge urgent">Urgent</span>';
    if (status === 'reviewed') return '<span class="badge reviewed">Reviewed</span>';
    return '<span class="badge pending">Pending review</span>';
  }

  function toggleForm(idx) {
    const card = document.getElementById('formCard' + idx);
    card.classList.toggle('open');
  }

  function render() {
    if (!session || session.role === 'doctor') return; // already redirecting

    const forms = getMyForms();
    const content = document.getElementById('content');

    if (forms.length === 0) {
      // ---- New patient: no forms filled yet ----
      document.getElementById('greetingHeading').textContent = 'Welcome, ' + (session.name || 'there');
      document.getElementById('greetingSub').textContent = "You haven't started an intake form yet.";

      content.innerHTML = `
        <div class="empty-state">
          <div class="icon">📝</div>
          <h3>No intake form on file</h3>
          <p>Fill out your intake form so the doctor has your history, symptoms, and vitals ready before your consultation.</p>
          <a href="complete.html" class="btn btn-primary">Fill Intake Form</a>
        </div>
      `;
      return;
    }

    // ---- Returning patient: has previous form(s) ----
    document.getElementById('greetingHeading').textContent = 'Welcome back, ' + (session.name || 'there');
    document.getElementById('greetingSub').textContent = forms.length === 1
      ? "Here's the intake form you've submitted."
      : `You've submitted ${forms.length} intake forms.`;

    const sorted = forms
      .map((f, i) => ({ ...f, _idx: i }))
      .sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    let html = `
      <div class="new-visit-card">
        <div class="left">
          <h3>Starting a new visit?</h3>
          <p>Fill a fresh intake form if you're reporting a new or different concern.</p>
        </div>
        <a href="complete.html" class="btn btn-primary">Fill New Intake Form</a>
      </div>

      <div class="section-label">Previous Forms</div>
    `;

    sorted.forEach((f, displayIdx) => {
      const noteHtml = f.doctorNotes
        ? `<div class="doctor-note-box">${f.doctorNotes}</div>`
        : `<div class="doctor-note-box empty">No doctor's notes yet — this case is still ${f.status === 'pending' ? 'awaiting' : ''} review.</div>`;

      html += `
        <div class="form-card" id="formCard${displayIdx}">
          <button class="form-card-summary" onclick="toggleForm(${displayIdx})">
            <div>
              <div class="fdate">${formatDate(f.submittedAt)}</div>
              <div class="fcomplaint">${f.chiefComplaint}</div>
            </div>
            ${badgeHtml(f.status)}
            <span class="chevron">▼</span>
          </button>
          <div class="form-card-details">
            <div class="detail-section">
              <h4>History</h4>
              <div class="detail-text">${f.history}</div>
            </div>
            <div class="detail-section">
              <h4>Reported Symptoms</h4>
              <div class="tag-list">
                ${f.symptoms.map(s => `<span class="tag">${s}</span>`).join('')}
              </div>
            </div>
            <div class="detail-section">
              <h4>Vitals</h4>
              <div class="vitals-grid">
                <div class="vital-box"><div class="v-label">BP</div><div class="v-value">${f.vitals.bp}</div></div>
                <div class="vital-box"><div class="v-label">Pulse</div><div class="v-value">${f.vitals.pulse}</div></div>
                <div class="vital-box"><div class="v-label">Temp</div><div class="v-value">${f.vitals.temp}</div></div>
                <div class="vital-box"><div class="v-label">SpO2</div><div class="v-value">${f.vitals.spo2}</div></div>
              </div>
            </div>
            <div class="detail-section">
              <h4>Doctor's Notes</h4>
              ${noteHtml}
            </div>
          </div>
        </div>
      `;
    });

    content.innerHTML = html;
    // Expand the most recent form by default
    document.getElementById('formCard0').classList.add('open');
  }

  render();
</script>

</body>
</html>
